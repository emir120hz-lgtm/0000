name: Build Kuro Client
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon
      - name: Sabit adli jar hazirla
        run: cp "$(ls build/libs/kuro-client-*.jar | grep -v sources | head -1)" kuro-client.jar
      - uses: actions/upload-artifact@v4
        with:
          name: KuroClient
          path: kuro-client.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kuro Client (son surum)
          files: kuro-client.jar
